services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: canals
      POSTGRES_PASSWORD: canals
      POSTGRES_DB: canals_orders
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U canals -d canals_orders"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
