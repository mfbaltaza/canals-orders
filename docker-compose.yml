services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: canals
      POSTGRES_PASSWORD: canals
      POSTGRES_DB: canals_orders
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U canals -d canals_orders"]
      interval: 2s
      timeout: 3s
      retries: 15

  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: build
    command: ["npm", "run", "db:deploy"]
    environment:
      DATABASE_URL: postgresql://canals:canals@db:5432/canals_orders
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runtime
    init: true
    environment:
      DATABASE_URL: postgresql://canals:canals@db:5432/canals_orders
      # The limit protects the public demo; load scripts here fire from one IP
      RATE_LIMIT_MAX: 0
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  # `docker compose run --rm test`: a throwaway database, never the app's
  test-db:
    image: postgres:16-alpine
    profiles: [test]
    environment:
      POSTGRES_USER: canals
      POSTGRES_PASSWORD: canals
      POSTGRES_DB: payment_review
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U canals -d payment_review"]
      interval: 2s
      timeout: 3s
      retries: 15

  test:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: build
    profiles: [test]
    command: ["sh", "-c", "npm run db:deploy && npm test"]
    environment:
      NODE_ENV: test
      DATABASE_URL: postgresql://canals:canals@test-db:5432/payment_review
      PAYMENT_TIMEOUT_MS: 1000
    depends_on:
      test-db:
        condition: service_healthy

volumes:
  pgdata:
